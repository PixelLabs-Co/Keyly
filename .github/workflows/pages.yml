name: Deploy web to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Optional: when the FIREBASE_WEB_CONFIG secret (the web app config as JSON) exists, build against real Firebase.
      - name: Firebase config
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          if [ -n "$FIREBASE_WEB_CONFIG" ]; then
            echo "$FIREBASE_WEB_CONFIG" | jq -r '"VITE_FIREBASE_API_KEY=\(.apiKey)", "VITE_FIREBASE_AUTH_DOMAIN=\(.authDomain)", "VITE_FIREBASE_PROJECT_ID=\(.projectId)", "VITE_FIREBASE_STORAGE_BUCKET=\(.storageBucket)", "VITE_FIREBASE_MESSAGING_SENDER_ID=\(.messagingSenderId)", "VITE_FIREBASE_APP_ID=\(.appId)"' > web/.env.production
            echo "Building against Firebase project $(echo "$FIREBASE_WEB_CONFIG" | jq -r .projectId)"
          else
            echo "No FIREBASE_WEB_CONFIG secret: building in demo mode"
          fi
      - run: npm run build
        working-directory: web
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      # SPA fallback so deep links like /homes work on Pages
      - run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
