<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyly buyer: vendors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D5C}a:hover{color:#0B2730}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F5F0; color: #0B2730; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; box-sizing: border-box; padding: 54px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="BuyerHome.dc.html" style="align-self: flex-start; height: 44px; display: flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; font-weight: 700; color: #0E4D5C">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0E4D5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Home</a>
    <p style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -1.1px">Vendors</p>

    <div style="background: #0E4D5C; color: #F4EDE1; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <div style="width: 40px; height: 40px; border-radius: 20px; background: #F4EDE1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="#0E4D5C" stroke-width="2"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="#0E4D5C" stroke-width="2" stroke-linecap="round"></path></svg>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.4">Pros that <span style="font-weight: 800">[Agent Name]</span> trusts and recommends.</p>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: {{c.bg}}; color: {{c.fg}}; box-shadow: inset 0 0 0 1px #DED6C8; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700">{{c.label}}</button>
      </sc-for>
    </div>

    <div style="background: #FFFFFF; border-radius: 18px; box-shadow: inset 0 0 0 1px #E4DCCF; display: flex; flex-direction: column">
      <sc-for list="{{vendors}}" as="v" hint-placeholder-count="5">
        <div style="min-height: 70px; border-bottom: 1px solid #EEE7DB; padding: 0 12px 0 16px; display: flex; align-items: center; gap: 10px">
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <p style="margin: 0; font-size: 15px; font-weight: 700">[{{v.cat}} company]</p>
            <p style="margin: 0; font-size: 12px; color: #3F5A62">{{v.cat}}</p>
          </div>
          <button aria-label="Text" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #F4EDE1; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="#0E4D5C" stroke-width="2" stroke-linejoin="round"></path></svg>
          </button>
          <button aria-label="Call" style="width: 44px; height: 44px; border: 0; border-radius: 14px; background: #0E4D5C; display: flex; align-items: center; justify-content: center; padding: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z" fill="none" stroke="#F4EDE1" stroke-width="2" stroke-linejoin="round"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="height: 84px; box-sizing: border-box; padding: 8px 12px 22px; background: #FFFFFF; box-shadow: 0 -1px 0 #E4DCCF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="BuyerHome.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #0E4D5C">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="#0E4D5C" stroke="#0E4D5C" stroke-width="2" stroke-linejoin="round"></path></svg>Home</a>
    <a href="BuyerDocuments.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linejoin="round"></path><path d="M14 3v5h5" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linejoin="round"></path></svg>Documents</a>
    <a href="BuyerMaintenance.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="#3F5A62" stroke-width="2"></circle><path d="M12 9v4l2.5 2M9 3h6" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linecap="round"></path></svg>Maintenance</a>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="#3F5A62" stroke-width="2"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linecap="round"></path></svg>Agent</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'All' };
  }
  renderVals() {
    const cat = (this.state && this.state.cat) || 'All';
    const cats = ['All', 'Plumbing', 'HVAC', 'Electrical', 'Landscaping'];
    const all = ['Plumbing', 'HVAC', 'Electrical', 'Landscaping', 'Handyman'].map((c) => ({ cat: c }));
    return {
      chips: cats.map((c) => ({
        label: c,
        on: c === cat,
        bg: c === cat ? '#0E4D5C' : '#FFFFFF',
        fg: c === cat ? '#F4EDE1' : '#0B2730',
        pick: () => this.setState({ cat: c })
      })),
      vendors: cat === 'All' ? all : all.filter((v) => v.cat === cat)
    };
  }
}
</script>
</body>
</html>
