<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyly agent sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 100%; height: 100%; min-height: 100%; box-sizing: border-box; padding: 28px 18px; display: flex; flex-direction: column; gap: 28px; background: #0B2730; color: #F4EDE1; font-family: 'Plus Jakarta Sans', system-ui, sans-serif">
  <a href="AgentHomes.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F4EDE1; padding: 0 6px">
    <span style="width: 34px; height: 34px; border-radius: 9px; background: #E2725B; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true"><g transform="rotate(-18 50 50)"><path d="M50 8L80 32V56H20V32Z" fill="#0E4D5C" stroke="#0E4D5C" stroke-width="6" stroke-linejoin="round"></path><circle cx="50" cy="33" r="6" fill="#F4EDE1"></circle><path d="M47 35H53L55 47H45Z" fill="#F4EDE1"></path><rect x="43" y="52" width="14" height="40" rx="4" fill="#0E4D5C"></rect><rect x="53" y="68" width="16" height="9" rx="2.5" fill="#0E4D5C"></rect><rect x="53" y="81" width="11" height="9" rx="2.5" fill="#0E4D5C"></rect></g></svg>
    </span>
    <span style="display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.6px; line-height: 1">keyly</span><span style="font-size: 11px; font-weight: 600; color: #7FC8B8">for agents</span></span>
  </a>
  <div style="display: flex; flex-direction: column; gap: 4px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <a href="{{it.href}}" style="height: 44px; border-radius: 12px; padding: 0 12px; display: flex; align-items: center; gap: 12px; text-decoration: none; font-size: 15px; font-weight: 700; background: {{it.bg}}; color: {{it.fg}}">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: {{it.dot}}"></span>{{it.label}}</a>
    </sc-for>
  </div>
  <div style="flex: 1"></div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: #12343F">
    <span style="width: 36px; height: 36px; border-radius: 18px; background: #F4EDE1; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="#0E4D5C" stroke-width="2"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="#0E4D5C" stroke-width="2" stroke-linecap="round"></path></svg>
    </span>
    <span style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 14px; font-weight: 700">[Agent Name]</span><span style="font-size: 12px; color: #9FB3B8">[Brokerage]</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["homes","vendors","brand","account"],"default":"homes"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'homes';
    const items = [
      { key: 'homes', label: 'Homes', href: 'AgentHomes.dc.html' },
      { key: 'vendors', label: 'My vendors', href: 'AgentVendors.dc.html' },
      { key: 'brand', label: 'Brand', href: 'AgentBrand.dc.html' },
      { key: 'account', label: 'Account & plan', href: 'AgentAccount.dc.html' }
    ];
    return {
      items: items.map((it) => {
        const on = it.key === active;
        return { ...it, bg: on ? '#12343F' : 'transparent', fg: on ? '#F4EDE1' : '#B9C7CB', dot: on ? '#E2725B' : '#24505C' };
      })
    };
  }
}
</script>
</body>
</html>
