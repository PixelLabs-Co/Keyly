<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyly buyer: maintenance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D5C}a:hover{color:#0B2730}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F5F0; color: #0B2730; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; box-sizing: border-box; padding: 54px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="BuyerHome.dc.html" style="align-self: flex-start; height: 44px; display: flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; font-weight: 700; color: #0E4D5C">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0E4D5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Home</a>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <p style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -1.1px">Maintenance</p>
      <button aria-label="Add a task" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #E2725B; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#0B2730" stroke-width="2.4" stroke-linecap="round"></path></svg>
      </button>
    </div>
    <p style="margin: 0; font-size: 14px; color: #3F5A62">Tap a task when it’s done. It comes back on its own schedule.</p>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <p style="margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #3F5A62">{{g.title}}</p>
        <div style="background: #FFFFFF; border-radius: 18px; box-shadow: inset 0 0 0 1px #E4DCCF; display: flex; flex-direction: column">
          <sc-for list="{{g.tasks}}" as="t" hint-placeholder-count="2">
            <button onClick="{{t.toggle}}" aria-pressed="{{t.done}}" style="min-height: 62px; border: 0; border-bottom: 1px solid #EEE7DB; background: transparent; padding: 0 16px; display: flex; align-items: center; gap: 14px; text-align: left; font-family: 'Plus Jakarta Sans', sans-serif; color: #0B2730">
              <sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
                <span style="width: 26px; height: 26px; border-radius: 13px; background: #0E4D5C; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
                  <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#F4EDE1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </span>
              </sc-if>
              <sc-if value="{{t.open}}" hint-placeholder-val="{{true}}">
                <span style="width: 26px; height: 26px; border-radius: 13px; box-sizing: border-box; border: 2px solid #9FB3B8; flex-shrink: 0"></span>
              </sc-if>
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700; color: {{t.color}}">{{t.name}}</span><span style="font-size: 12px; color: #3F5A62">{{t.note}}</span></span>
            </button>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="height: 84px; box-sizing: border-box; padding: 8px 12px 22px; background: #FFFFFF; box-shadow: 0 -1px 0 #E4DCCF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="BuyerHome.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linejoin="round"></path></svg>Home</a>
    <a href="BuyerDocuments.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linejoin="round"></path><path d="M14 3v5h5" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linejoin="round"></path></svg>Documents</a>
    <a href="BuyerMaintenance.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #0E4D5C">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="#0E4D5C" stroke="#0E4D5C" stroke-width="2"></circle><path d="M12 9v4l2.5 2" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path><path d="M9 3h6" stroke="#0E4D5C" stroke-width="2" stroke-linecap="round"></path></svg>Maintenance</a>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="#3F5A62" stroke-width="2"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linecap="round"></path></svg>Agent</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {} };
  }
  renderVals() {
    const groups = [
      { title: 'This week', tasks: [{ id: 'smoke', name: 'Test smoke detectors', note: 'Every month' }] },
      { title: 'This month', tasks: [{ id: 'hvac', name: 'Replace HVAC filter', note: 'Every 3 months' }, { id: 'dryer', name: 'Clean dryer vent', note: 'Every year' }] },
      { title: 'Winter', tasks: [{ id: 'faucet', name: 'Cover outdoor faucets', note: 'Before the first freeze' }, { id: 'drafts', name: 'Check windows for drafts', note: 'Every winter' }] }
    ];
    const done = (this.state && this.state.done) || {};
    return {
      groups: groups.map((g) => ({
        ...g,
        tasks: g.tasks.map((t) => {
          const isDone = !!done[t.id];
          return {
            ...t,
            done: isDone,
            open: !isDone,
            color: isDone ? '#3F5A62' : '#0B2730',
            toggle: () => this.setState({ done: { ...done, [t.id]: !isDone } })
          };
        })
      }))
    };
  }
}
</script>
</body>
</html>
