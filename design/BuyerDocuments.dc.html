<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Keyly buyer: documents</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#0E4D5C}a:hover{color:#0B2730}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #F7F5F0; color: #0B2730; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; overflow: hidden">
  <div style="flex: 1; min-height: 0; overflow: hidden; box-sizing: border-box; padding: 54px 20px 16px; display: flex; flex-direction: column; gap: 14px">
    <a href="BuyerHome.dc.html" style="align-self: flex-start; height: 44px; display: flex; align-items: center; gap: 4px; text-decoration: none; font-size: 15px; font-weight: 700; color: #0E4D5C">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="#0E4D5C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Home</a>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <p style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -1.1px">Documents</p>
      <button aria-label="Add a document" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #E2725B; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="#0B2730" stroke-width="2.4" stroke-linecap="round"></path></svg>
      </button>
    </div>
    <label style="height: 46px; border-radius: 14px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E4DCCF; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="#3F5A62" stroke-width="2"></circle><path d="M16 16l4 4" stroke="#3F5A62" stroke-width="2" stroke-linecap="round"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search documents</span>
      <input type="search" placeholder="Search documents" style="flex: 1; border: 0; outline: none; background: transparent; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; color: #0B2730">
    </label>

    <p style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #3F5A62">Folders</p>
    <div style="background: #FFFFFF; border-radius: 18px; box-shadow: inset 0 0 0 1px #E4DCCF; display: flex; flex-direction: column">
      <sc-for list="{{folders}}" as="f" hint-placeholder-count="4">
        <button style="min-height: 64px; border: 0; border-bottom: 1px solid #EEE7DB; background: transparent; padding: 0 16px; display: flex; align-items: center; gap: 14px; text-align: left; font-family: 'Plus Jakarta Sans', sans-serif; color: #0B2730">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: {{f.tint}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" fill="none" stroke="{{f.ink}}" stroke-width="2" stroke-linejoin="round"></path></svg>
          </span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">{{f.name}}</span><span style="font-size: 12px; color: #3F5A62">{{f.from}}</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </button>
      </sc-for>
    </div>

    <p style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #3F5A62">Recently added</p>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{recent}}" as="r" hint-placeholder-count="2">
        <button style="height: 60px; border: 0; border-radius: 16px; background: #F4EDE1; padding: 0 14px; display: flex; align-items: center; gap: 12px; text-align: left; font-family: 'Plus Jakarta Sans', sans-serif; color: #0B2730">
          <span style="width: 34px; height: 40px; border-radius: 6px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E4DCCF; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px; box-sizing: border-box; font-size: 9px; font-weight: 800; color: #B4513C">PDF</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 700">{{r.name}}</span><span style="font-size: 12px; color: #3F5A62">{{r.where}}</span></span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="height: 84px; flex-shrink: 0; box-sizing: border-box; padding: 8px 12px 22px; background: #FFFFFF; box-shadow: 0 -1px 0 #E4DCCF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr))">
    <a href="BuyerHome.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linejoin="round"></path></svg>Home</a>
    <a href="BuyerDocuments.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: #0E4D5C">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" fill="#0E4D5C" stroke="#0E4D5C" stroke-width="2" stroke-linejoin="round"></path></svg>Documents</a>
    <a href="BuyerMaintenance.dc.html" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5" fill="none" stroke="#3F5A62" stroke-width="2"></circle><path d="M12 9v4l2.5 2M9 3h6" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linecap="round"></path></svg>Maintenance</a>
    <button style="border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 600; color: #3F5A62">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="#3F5A62" stroke-width="2"></circle><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" fill="none" stroke="#3F5A62" stroke-width="2" stroke-linecap="round"></path></svg>Agent</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      folders: [
        { name: 'Closing documents', from: 'From [Agent Name]', tint: '#DCEAE6', ink: '#0E4D5C' },
        { name: 'Inspection', from: 'From [Agent Name]', tint: '#DCEAE6', ink: '#0E4D5C' },
        { name: 'Warranties & manuals', from: 'From [Agent Name]', tint: '#DCEAE6', ink: '#0E4D5C' },
        { name: 'My uploads', from: 'Added by you', tint: '#F6D6C8', ink: '#B4513C' }
      ],
      recent: [
        { name: 'Closing Disclosure', where: 'Closing documents' },
        { name: 'Home Inspection Report', where: 'Inspection' }
      ]
    };
  }
}
</script>
</body>
</html>
